# Continuous integration.
#
# The Linux job is the point of this file. Everything in the repository has
# been developed and verified on arm64 macOS; whether it works on x86-64 Linux
# has been an assumption, and an assumption that was wrong once already -- the
# checked-in runtime.ll said "target-cpu"="apple-m1" on all thirty of its
# functions while the documentation called it portable. ./portability.sh now
# catches that class of thing without another machine, but only a Linux box
# can say whether the result runs.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: x86-64 Linux
    runs-on: ubuntu-latest
    env:
      LLVM_VERSION: "20"
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM, flex and bison
        run: |
          sudo apt-get update
          # zlib1g-dev and libzstd-dev are not optional: LLVMSupport as
          # Debian builds it names ZLIB::ZLIB and zstd::libzstd_shared in
          # its link interface, and CMake fails inside LLVMExports.cmake
          # without them, saying nothing about a package.
          sudo apt-get install -y flex bison zlib1g-dev libzstd-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          # lld links every program: catmintc runs LLVM's tools and no C
          # compiler. clang is here for the developer's side -- rebuilding
          # the runtime, and the sanitizer run -- and clang-16 because the
          # shipped runtime is built by the oldest LLVM catmint supports, so
          # build-runtime.sh --check can reproduce it.
          #
          # libsdl2-dev is for the SDL library and the game, whose tests run
          # here on SDL's dummy video and audio drivers (no screen, no sound
          # card) as part of test.sh. Without it that section would only say
          # "skipped", which is not a pass.
          sudo apt-get install -y "llvm-$LLVM_VERSION-dev" "clang-$LLVM_VERSION" \
                                  "lld-$LLVM_VERSION" clang-16 llvm-16 libsdl2-dev
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          llvm-config --version
          clang --version | head -1
          bison --version | head -1

      # The three components, in dependency order. LLVM_CONFIG is how both
      # Makefiles are told where LLVM is.
      - name: Build
        run: |
          export LLVM_CONFIG="$(command -v llvm-config)"
          make -C catmint-ast -f GNUmakefile build
          make -C catmint-lex LLVM_CONFIG="$LLVM_CONFIG"
          make -C catmint-gen LLVM_CONFIG="$LLVM_CONFIG"

      # --thorough is the whole net: both suites, every test at -O0 through
      # -O3 and separately compiled, 50 random programs differentially tested
      # against C, and 300 mutants through the front end.
      - name: Test
        run: ./test.sh --no-build --thorough

      # The shipped runtime-linux.bc has to be what runtime.c builds to.
      - name: Runtime reproduces
        run: catmint-gen/build-runtime.sh --check

      - name: Portability
        run: ./portability.sh

      # The check to repeat after anything touching reference counting: a
      # release too many is a use-after-free here and nothing at all
      # otherwise. LeakSanitizer runs alongside it on Linux and is left on --
      # it is the only place leaks show up, macOS does not run it, and every
      # test is clean, so a leak here is a regression.
      #
      # A script in the repository, not a loop written out in this file. That
      # is the lesson from the first version: it existed only here, could not
      # be run locally, and had two faults nobody could see -- it ran from the
      # wrong directory, so a test's `.args` did not resolve, and it captured a
      # program's output without `|| true`, so under `bash -e` the first test
      # that exited non-zero killed the step before anything was reported. The
      # failure was an exit code with no output at all.
      - name: AddressSanitizer and LeakSanitizer
        run: ./sanitize.sh

      # Not a gate: the numbers vary far too much on a shared runner to fail a
      # build over. It is here so a catastrophic regression is visible in the
      # log, which is how the -O0 runtime and the stray Int64 store were both
      # found.
      - name: Benchmarks
        continue-on-error: true
        run: ./bench/run.sh

  macos:
    name: arm64 macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and bison
        run: |
          brew install llvm@22 llvm@16 lld bison flex sdl2
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Build and test
        run: ./test.sh --thorough

      - name: Runtime reproduces
        run: catmint-gen/build-runtime.sh --check

      - name: Portability
        run: ./portability.sh

      # LeakSanitizer does not exist on Darwin, so this half of the matrix
      # checks only for use-after-free and overflow -- but it checks, which it
      # did not before: the step was in the Linux job alone, which is why the
      # arm job stayed green through a Linux failure. It never ran this code.
      - name: AddressSanitizer
        run: ./sanitize.sh
